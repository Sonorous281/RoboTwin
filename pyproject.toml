[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-robotwin-runtime"
version = "0.1.0"
description = "Installable RoboTwin runtime and dependency contract maintained for RLinf"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.12"
authors = [{name = "RLinf Contributors"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
]
# NOTE: ``curobo`` is a runtime requirement for the CuroboPlanner backend but is
# intentionally NOT listed in ``dependencies``. Its ``[build-system]`` requires
# ``torch`` (unpinned), so a resolver honouring build isolation would pull a
# fresh CPU/wrong-CUDA torch into the isolated build env and compile the CUDA
# extensions against it. It is instead installed with ``--no-build-isolation``
# (so it compiles against the already-installed ``torch==2.8.0+cu128``) from
# the exact upstream commit that was previously vendored:
#   pip install --no-build-isolation \
#     "curobo @ git+https://github.com/NVlabs/curobo.git@d64c4b005459db10c5dd867d8b30a87d5bda9bdb"
# ``robotwin.envs.robot.planner`` imports ``curobo`` behind a ``try/except``, so
# the robotwin wheel itself imports cleanly without curobo present; curobo is
# only needed when ``CuroboPlanner`` is instantiated. See ``script/_install.sh``.
dependencies = [
    "gymnasium==0.29.1",
    "huggingface-hub>=0.27.1",
    "imageio==2.34.2",
    "matplotlib",
    "mplib==0.2.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "open3d==0.18.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "pillow>=10",
    "pyyaml",
    "sapien==3.0.0b1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "scipy==1.10.1",
    "setuptools>=69.5.1,<75.9",
    "torch==2.7.1",
    "toppra==0.6.3",
    "transforms3d==0.4.2",
    "trimesh==4.4.3",
    "warp-lang==1.11.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "yourdfpy>=0.0.53",
]

[project.scripts]
robotwin-download-assets = "robotwin.assets:main"

[project.urls]
Homepage = "https://github.com/RoboTwin-Platform/RoboTwin"
Repository = "https://github.com/RoboTwin-Platform/RoboTwin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["robotwin*"]
exclude = ["script*", "description*", "task_config*", "tests*"]

[tool.setuptools.package-data]
robotwin = [
    "configs/task/*.yml",
    "description/task_instruction/*.json",
    "description/objects_description/**/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
